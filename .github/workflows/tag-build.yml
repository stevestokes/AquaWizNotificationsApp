name: Tagged APK Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - app/build.gradle.kts

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.AQUAWIZ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AQUAWIZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AQUAWIZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AQUAWIZ_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing AQUAWIZ_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing AQUAWIZ_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing AQUAWIZ_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing AQUAWIZ_KEY_PASSWORD" && exit 1)

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AQUAWIZ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aquawiz-release.jks"

      - name: Test and build signed release APK
        env:
          AQUAWIZ_KEYSTORE_PATH: ${{ runner.temp }}/aquawiz-release.jks
          AQUAWIZ_KEYSTORE_PASSWORD: ${{ secrets.AQUAWIZ_KEYSTORE_PASSWORD }}
          AQUAWIZ_KEY_ALIAS: ${{ secrets.AQUAWIZ_KEY_ALIAS }}
          AQUAWIZ_KEY_PASSWORD: ${{ secrets.AQUAWIZ_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Determine release tag
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          RELEASE_TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AquaWizNotifier.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/AquaWizNotifier-$RELEASE_TAG.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE="dist/AquaWizNotifier.apk"
          VERSIONED="dist/AquaWizNotifier-$RELEASE_TAG.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$STABLE" "$VERSIONED" --clobber
          else
            gh release create "$RELEASE_TAG" "$STABLE" "$VERSIONED" \
              --title "AquaWiz Notifier $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aquawiz-release.jks"
